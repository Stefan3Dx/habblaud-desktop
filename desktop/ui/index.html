<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; script-src 'self'; font-src 'self' data:; frame-src http://127.0.0.1:* http://localhost:*" />
    <title>Habblaud</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="../node_modules/@highlightjs/cdn-assets/styles/github-dark.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="side-top">
          <div class="brand"><img src="../icon.png" alt="" /> Habblaud</div>
          <button id="btn-new" class="new" title="Chat nou (Ctrl+N)">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg> Chat nou
          </button>
        </div>
        <div class="search"><input id="search" placeholder="Caută conversații" spellcheck="false" /></div>
        <div id="sessions"></div>
        <div id="side-foot"></div>
      </aside>

      <main id="main">
        <header id="head">
          <button id="btn-side" class="icon" title="Ascunde / arată lista (Ctrl+B)">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg>
          </button>
          <div id="title">Chat nou</div>
          <button id="cwd" class="chip" title="Folderul proiectului"></button>
          <div class="grow"></div>
          <span id="status-dot" title=""></span>
          <button id="btn-panel" class="icon" title="Ascunde / arată panoul din dreapta (Ctrl+J)">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M15 4v16" /></svg>
          </button>
        </header>
        <div id="banner" hidden></div>
        <div id="chats"></div>
        <div id="welcome">
          <img src="../icon.png" alt="" />
          <h1>Ce construim azi?</h1>
          <p>Alege folderul proiectului și scrie-i lui Claude. Poți atașa imagini, video, PDF-uri și fișiere.</p>
          <div id="recent-dirs"></div>
        </div>
        <footer id="composer">
          <div id="attachments"></div>
          <textarea id="input" rows="1" placeholder="Scrie un mesaj pentru Claude…" spellcheck="false"></textarea>
          <div class="row">
            <button id="btn-attach" class="icon" title="Atașează fișiere (sau trage / lipește)">
              <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3" /></svg>
            </button>
            <select id="sel-mode" title="Permisiuni">
              <option value="default">Întreabă înainte</option>
              <option value="acceptEdits">Acceptă editările</option>
              <option value="plan">Mod plan</option>
              <option value="bypassPermissions">Fără confirmări</option>
            </select>
            <div class="grow"></div>
            <select id="sel-model" title="Model">
              <option value="">Model implicit</option>
              <option value="opus">Opus</option>
              <option value="sonnet">Sonnet</option>
              <option value="haiku">Haiku</option>
            </select>
            <button id="btn-send" title="Trimite (Enter)">
              <svg class="send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
              <svg class="stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" /></svg>
            </button>
          </div>
        </footer>
        <div id="drop"><div>Lasă fișierele aici</div></div>
      </main>

      <div id="split"></div>

      <section id="panel">
        <nav id="ptabs">
          <button data-tab="habblaud" class="active">Habblaud</button>
          <button data-tab="terminal">Terminal</button>
          <div class="grow"></div>
          <button id="btn-reload" class="icon small" title="Reîncarcă Habblaud">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v5h-5" /></svg>
          </button>
        </nav>
        <div id="pt-habblaud" class="pt active">
          <div id="hb-loading">Pornesc Habblaud…</div>
          <webview id="hb" allowpopups></webview>
        </div>
        <div id="pt-terminal" class="pt">
          <div id="term-tabs"></div>
          <div id="term-host"></div>
        </div>
      </section>
    </div>

    <div id="setup" hidden>
      <div class="box">
        <h2>Pregătesc totul…</h2>
        <p id="setup-step">Verific Claude Code, Git și mod-ul Habblaud.</p>
        <pre id="setup-log"></pre>
      </div>
    </div>

    <script src="../node_modules/marked/lib/marked.umd.js"></script>
    <script src="../node_modules/dompurify/dist/purify.min.js"></script>
    <script src="../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="render.js"></script>
    <script src="terminal.js"></script>
    <script src="app.js"></script>
  </body>
</html>
